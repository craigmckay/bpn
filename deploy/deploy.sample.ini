; Copy this file to deploy.ini and fill in your details.
; deploy.ini is gitignored - it holds your FTP password.
;
;     copy deploy\deploy.sample.ini deploy\deploy.ini

; Host and credentials
HOST=ftp.southesk.com
USER=your-ftp-username
PASS=your-ftp-password

; Protocol: ftp, ftps or sftp. Prefer ftps or sftp - plain ftp sends your
; password in the clear.
;
; ftps here means explicit FTPS (AUTH TLS on port 21), which is what cPanel
; hosting normally offers. sftp needs a curl build with SSH support; the one
; bundled with Windows may not have it, in which case use ftps.
PROTOCOL=ftps

; Absolute path to the Joomla document root on the server.
REMOTE=/public_html

; Set to 1 only if FTPS fails with a certificate error. Shared hosting often
; presents a certificate for the hosting company rather than your domain.
; This skips verification - the connection is still encrypted, but no longer
; proof against an interceptor. Try 0 first.
INSECURE=0
